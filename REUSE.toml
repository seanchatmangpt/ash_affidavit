version = 1

[[annotations]]
path = ["mix.lock", ".gitignore", ".formatter.exs", "priv/affidavit/**", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_affidavit contributors"
SPDX-License-Identifier = "MIT"

# Generated by the qri-qualification-profile-pack beam-host set; the file header says GENERATED.
[[annotations]]
path = [
  "lib/ash_affidavit/abi.ex",
  "lib/ash_affidavit/wasm_config.ex",
  "lib/ash_affidavit/engine_load.ex",
  "lib/ash_affidavit/host.ex",
  "lib/ash_affidavit/pool.ex",
  "lib/mix/tasks/ash_affidavit.vendor.ex",
  "lib/mix/tasks/ash_affidavit.verify.ex",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_affidavit contributors"
SPDX-License-Identifier = "MIT"

# Generated by the ash-extension-pack (scripts/render_extension.sh); the pack output carries no header.
[[annotations]]
path = [
  "lib/ash_affidavit/resource.ex",
  "lib/ash_affidavit/persist.ex",
  "lib/ash_affidavit/verify.ex",
  "lib/ash_affidavit/info.ex",
  "lib/mix/tasks/ash_affidavit.install.ex",
  "test/ash_affidavit_composition_test.exs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_affidavit contributors"
SPDX-License-Identifier = "MIT"

# The wasm is built from the affidavit engine repository; its own license applies to its sources.
[[annotations]]
path = ["README.md", "CHANGELOG.md", "HANDWRITTEN.md", "LICENSE", "LICENSES/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_affidavit contributors"
SPDX-License-Identifier = "MIT"

# Files that carry no header of their own or are generated by tooling.
[[annotations]]
path = [
  ".tool-versions",
  ".credo.exs",
  ".dialyzer_ignore.exs",
  ".github/**",
  "config/**",
  "documentation/**",
  "usage-rules.md",
  "usage-rules/**",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_affidavit contributors"
SPDX-License-Identifier = "MIT"
