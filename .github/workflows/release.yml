# SPDX-License-Identifier: MIT

# Release gate. On a v* tag it re-runs every CI gate on the exact tag subject, asserts the tag equals
# "v" + the mix.exs version, and runs `mix hex.publish --yes` only when the HEX_API_KEY secret is
# configured. workflow_dispatch never publishes: it runs `mix hex.publish --dry-run`.
# No credential value appears in this file.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ref-court:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Admit only main or a v* tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) echo "ref admitted: $GITHUB_REF" ;;
            *) echo "REFUSED(ref:$GITHUB_REF is neither main nor a v* tag)" >&2; exit 2 ;;
          esac

  supply-chain:
    needs: ref-court
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse retired or advisory Hex packages
        run: mix hex.audit
      - name: Audit dependencies against advisories
        run: mix deps.audit
      - name: Package closure (no build dirs, cover or tmp shipped; manifest, licenses and usage rules shipped)
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          rm -rf "$pkg"
          mix hex.build --unpack -o "$pkg"
          for p in priv/affidavit/MANIFEST.json LICENSES REUSE.toml usage-rules.md usage-rules documentation; do
            test -e "$pkg/$p" || { echo "REFUSED(package:missing $p)" >&2; exit 2; }
          done
          for bad in '_build*' cover tmp; do
            if find "$pkg" -name "$bad" | grep -q .; then
              echo "REFUSED(package:ships $bad)" >&2
              find "$pkg" -name "$bad" >&2
              exit 2
            fi
          done

  quality:
    needs: ref-court
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix sobelow --skip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ash-affidavit-plt-v1-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-affidavit-plt-v1-${{ runner.os }}-
      - run: mix dialyzer --plt
      - run: mix dialyzer

  docs:
    needs: ref-court
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Docs build (warnings are errors)
        run: mix docs --warnings-as-errors

  spark-drift:
    needs: ref-court
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Regenerate Spark formatter config and cheat sheets
        run: |
          set -euo pipefail
          mix spark.formatter
          mix spark.cheat_sheets
      - name: Refuse Spark projection drift
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- documentation/dsls .formatter.exs; then
            echo "REFUSED(spark:committed DSL docs or .formatter.exs differ from regeneration)" >&2
            exit 2
          fi
          untracked="$(git ls-files --others --exclude-standard -- documentation/dsls)"
          if [ -n "$untracked" ]; then
            echo "REFUSED(spark:uncommitted DSL projection)" >&2
            printf '%s\n' "$untracked" >&2
            exit 2
          fi

  test:
    needs: ref-court
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Verify the vendored engine against its pin
        run: mix ash_affidavit.verify
      - name: Tests (real pinned wasm, no mocks)
        run: mix test

  publish:
    needs: [supply-chain, quality, docs, spark-drift, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - name: Tag identity (tag must equal v + mix.exs version)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          version="$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])' | tail -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "REFUSED(tag:$GITHUB_REF_NAME != v$version)" >&2
            exit 2
          fi
      - name: Dry run (workflow_dispatch never publishes)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: mix hex.publish --dry-run
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: Publish to Hex (tag push, only when HEX_API_KEY is configured)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "HEX_API_KEY not configured: not publishing"
            exit 0
          fi
          mix hex.publish --yes
